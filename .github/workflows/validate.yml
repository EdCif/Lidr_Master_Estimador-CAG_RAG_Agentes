name: Validar estimador CAG

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_llm:
        description: "Ejecutar también una llamada real a OpenAI (consume API)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Pipeline sin credenciales (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Instalar dependencias del lockfile
        run: uv sync --locked --python 3.11
      - name: Validar estructura, pruebas y flujo CAG simulado
        run: uv run python scripts/validate_pipeline.py
      - name: Guardar informe y estimación simulada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  live:
    name: Validación real de OpenAI (manual)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live_llm &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - name: Validar la transcripción del ejercicio con OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_PROVIDER: openai
          APP_DEBUG: "false"
          LOG_LEVEL: WARNING
        run: uv run python scripts/validate_pipeline.py --live
      - name: Guardar informe y estimación del ejercicio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-live
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
