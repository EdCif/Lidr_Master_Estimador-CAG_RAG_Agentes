[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador con configuración centralizada e integración con OpenAI."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11.0",
    "chainlit>=2.12.0",
    "fastapi>=0.115,<1",
    "gradio>=6.28.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.102.0",
    "markitdown[pdf]>=0.1.8",
    "openai>=2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "streamlit>=1.64.0",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# pytest (Paso 03): busca los tests en tests/, deja importar el paquete "app"
# desde la raíz y ejecuta los tests "async def" sin decorarlos uno a uno.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
